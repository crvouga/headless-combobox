name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push docs image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: crvouga/headless-combobox-docs:latest
          platforms: linux/amd64,linux/arm64

      - name: Build and push svelte example image
        uses: docker/build-push-action@v5
        with:
          context: ./example/svelte
          file: ./example/svelte/Dockerfile
          push: true
          tags: crvouga/headless-combobox-svelte-example:latest
          platforms: linux/amd64,linux/arm64
